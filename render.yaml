# Render Blueprint — one API service, one database, one static site.
#
# Deploy with: Dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates all three resources in one pass.
#
# Costs at the time of writing (Render pricing page):
#   web service   free  = $0    (spins down after 15 min idle, ~50s cold start)
#                 0.5c-512mb = $7/month   <- recommended for anything real
#   postgres      free  = $0    (expires 30 days after creation, no backups)
#                 0.1c-256mb = $6/month  <- recommended
#   static site   always $0
#
# So a prototype is free, and a real deployment is ~$13/month.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: portal-api
    runtime: node
    region: oregon
    # `free` cannot use preDeployCommand, so migrations run at boot instead
    # (RUN_MIGRATIONS_ON_BOOT below). Switch to `0.5c-512mb` and set
    # preDeployCommand for a production deployment.
    plan: free
    # Compile to plain JS. Running TypeScript through `tsx` in production keeps
    # esbuild resident: measured 268 MB idle / 294 MB peak versus 196 MB / 237 MB
    # for compiled output, on a 512 MB instance. It also transpiles slower on a
    # 0.1-CPU instance, which matters for cold starts.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @portal/api build
    startCommand: pnpm --filter @portal/api start
    # preDeployCommand: pnpm --filter @portal/api db:migrate   # paid plans only
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - pnpm-lock.yaml
        - package.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "1"
      # Keep V8 collecting early instead of being killed by the container limit
      # (512 MB on the free plan).
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString

      # Signing key for session cookies. Generated once, stored by Render.
      - key: BETTER_AUTH_SECRET
        generateValue: true

      # Set these in the Dashboard after the first deploy, once you know the
      # service URLs Render assigned (they can differ from the names here).
      - key: BETTER_AUTH_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false

      # Email. Use an API key, never SMTP: Render blocks outbound 587/25.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  # ---------------------------------------------------------------- PWA
  - type: web
    name: portal-pwa
    runtime: static
    # No `region` here: static sites are served from Render's global CDN and
    # the API rejects a region on them.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @portal/pwa build
    staticPublishPath: ./apps/pwa/dist
    buildFilter:
      paths:
        - apps/pwa/**
        - apps/api/src/**
        - pnpm-lock.yaml
        - package.json
    routes:
      # Same-origin API. The browser sees /api/* on the static site's own
      # domain, so the session cookie is first-party: no CORS, no
      # SameSite=None, no third-party cookie restrictions.
      #
      # Order matters — the first matching rule wins, so this must precede the
      # SPA catch-all. Render does not apply rules to paths where a file
      # exists, which is why /api/* has to be listed first.
      - type: rewrite
        source: /api/*
        # NOTE: this hostname is what Render actually assigned. A service named
        # `portal-api` becomes `portal-api-<suffix>` when the plain name is
        # taken, so after any re-create, copy the API's real URL from the
        # Dashboard into this line. A stale destination here fails as a 502 on
        # every /api request.
        destination: https://portal-api-7i3v.onrender.com/api/*

      # Client-side routing, and the offline shell for navigations.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The service worker must never come from a stale cache, or a bad deploy
      # can strand users on an old shell.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      # Vite fingerprints these, so they are immutable.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Without this the CDN serves the manifest as binary/octet-stream and
      # Chrome refuses to offer installation. Found only by testing the live
      # site — the file is valid JSON, so nothing local catches it.
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

databases:
  - name: portal-db
    # `free` expires 30 days after creation and cannot be backed up. Move to
    # `0.1c-256mb` ($6/month) as soon as real data matters.
    plan: free
    postgresMajorVersion: "18"
    region: oregon
